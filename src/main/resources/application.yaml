spring:
  application:
    name: test-exchange-service
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 3000

resilience4j:
  retry:
    instances:
      exchangeRateApi:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        # Solo fallos transitorios: timeouts/errores de conexión y respuestas 5xx
        retry-exceptions:
          - feign.RetryableException
          - feign.FeignException$FeignServerException
  circuitbreaker:
    instances:
      exchangeRateApi:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        # Cualquier fallo al llamar a la API cuenta; una moneda inválida no (la API respondió bien)
        record-exceptions:
          - feign.FeignException

exchange-rate:
  api:
    base-url: https://v6.exchangerate-api.com/v6
    key: ${EXCHANGE_API_KEY:}


